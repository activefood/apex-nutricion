<!doctype html>
<html lang="es-VE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#14120F">
<title>Panel de pedidos · Apex</title>
<link rel="manifest" href="panel/panel.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="panel/icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="panel/icon-192.png?v=2">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-var.woff2" crossorigin>
<link rel="stylesheet" href="panel/panel.css?v=5">
</head>
<body>

<!-- Entrada con código compartido -->
<main class="login" id="login">
  <form class="login-box" id="login-form" autocomplete="off">
    <p class="eyebrow">Apex Nutrición</p>
    <h1>Panel de pedidos</h1>
    <label for="login-code">Código de acceso</label>
    <input id="login-code" name="code" type="password" inputmode="text" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <p class="login-error" id="login-error" role="alert" hidden></p>
    <button class="btn btn--primary" type="submit" id="login-btn">Entrar</button>
  </form>
</main>

<!-- Panel -->
<div class="app" id="app" hidden>
  <header class="bar">
    <div class="bar-title">
      <h1>Pedidos</h1>
      <span class="live" id="live" role="status"><span class="live-dot" aria-hidden="true"></span><span id="live-text">Conectando…</span></span>
      <span class="clock" id="clock" aria-hidden="true"></span>
    </div>
    <div class="bar-tools">
      <button type="button" class="tool" id="tool-ventas" aria-pressed="false">Dashboard de Ventas</button>
    </div>
  </header>

  <p class="notice" id="sound-notice" hidden>El sonido está bloqueado por el navegador. <button type="button" class="linkbtn" id="sound-enable">Tocar aquí para activarlo</button></p>

  <main class="board">
    <h2 class="board-title" id="h-list">Pedidos <span class="count" data-count="all">0</span><small>por atender</small></h2>
    <div class="list" data-list="all" aria-labelledby="h-list"></div>
  </main>

  <section class="ventas" id="ventas" aria-labelledby="h-ventas" hidden>
    <div class="ventas-head">
      <h2 id="h-ventas">Ventas</h2>
      <span class="ventas-live" id="ventas-live" role="status"></span>
    </div>
    <div class="ventas-filtro" role="group" aria-label="Periodo">
      <button type="button" class="chip is-on" data-periodo="mes" aria-pressed="true">Este mes</button>
      <button type="button" class="chip" data-periodo="anterior" aria-pressed="false">Mes anterior</button>
      <button type="button" class="chip" data-periodo="historico" aria-pressed="false">Histórico</button>
      <button type="button" class="chip" data-periodo="fechas" aria-pressed="false">Fechas</button>
    </div>
    <form class="ventas-fechas" id="ventas-fechas" hidden>
      <label>Desde <input type="date" id="v-desde" required></label>
      <label>Hasta <input type="date" id="v-hasta" required></label>
      <button type="submit" class="btn btn--primary">Ver</button>
    </form>
    <p class="ventas-error" id="ventas-error" role="alert" hidden></p>
    <div class="kpis" id="v-kpis"></div>
    <section class="v-card">
      <div class="v-card-head"><h3 id="v-titulo">Ventas por día</h3>
        <div class="ventas-filtro ventas-filtro--min" id="v-metricas" role="group" aria-label="Qué ver por mes" hidden>
          <button type="button" class="chip is-on" data-metrica="pedidos" aria-pressed="true">Pedidos</button>
          <button type="button" class="chip" data-metrica="ventas" aria-pressed="false">Vendido ($)</button>
          <button type="button" class="chip" data-metrica="ticket" aria-pressed="false">Ticket promedio</button>
          <button type="button" class="chip" data-metrica="unidades" aria-pressed="false">Unidades</button>
        </div></div>
      <div id="v-chart" class="v-chart"></div>
      <p class="v-leyenda" id="v-leyenda" hidden></p>
    </section>
    <section class="v-card">
      <div class="v-card-head"><h3>Distribución de productos</h3>
        <div class="ventas-filtro ventas-filtro--min" role="group" aria-label="Agrupar por">
          <button type="button" class="chip is-on" data-grupo="producto" aria-pressed="true">Por producto</button>
          <button type="button" class="chip" data-grupo="marca" aria-pressed="false">Por marca</button>
        </div></div>
      <div id="v-dist" class="v-dist"></div>
    </section>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="panel/panel.js?v=12"></script>
<script src="panel/ventas.js?v=9"></script>
</body>
</html>
